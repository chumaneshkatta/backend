spring.application.name=ai
server.port=8080

# MySQL (override with env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/onboarding?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: set JWT_SECRET (32+ chars). If unset, a random secret is generated per run (everyone is signed out on restart).
# With APP_PRODUCTION=true the app refuses to start without JWT_SECRET.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60
app.production=${APP_PRODUCTION:false}

# Comma-separated allowed browser origins; "*" in the port is a wildcard. Default: any local port.
app.cors.origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
